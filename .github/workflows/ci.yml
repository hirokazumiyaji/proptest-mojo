name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repository and runs tests.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # pixi.toml platforms: linux-64, osx-arm64 (pin macOS arm64 image)
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          # Save caches on main only to stay under the Actions cache size limit.
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          locked: true

      - name: Format check
        run: pixi run format-check

      - name: Test
        run: pixi run test
