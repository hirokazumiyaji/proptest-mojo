name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pixi.toml platforms: linux-64, osx-arm64
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          # Save caches on main only to stay under the Actions cache size limit.
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          locked: true

      - name: Format check
        run: pixi run format-check

      - name: Test
        run: pixi run test
