context:
  name: proptest
  version: "0.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mojo precompile src/proptest -o ${{ PREFIX }}/lib/mojo/proptest.mojoc

requirements:
  build:
    - mojo-compiler =1.1.0
  host:
    - mojo-compiler =1.1.0
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - mojo run test.mojo
    files:
      recipe:
        - test.mojo

about:
  homepage: https://github.com/hirokazumiyaji/proptest-mojo
  repository: https://github.com/hirokazumiyaji/proptest-mojo
  summary: Pure Mojo property-based testing library
  description: >
    Property-based testing for Pure Mojo: generate examples, shrink failures,
    and replay counterexamples.
